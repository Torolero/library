<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Library</title>
    <link rel="icon" href="./Icons/page_title/education_books_library_icon_149685.ico" type="image/x-icon">
</head>
<body>
    <div class="header">
        <div class="title-container">
            <h1 class="page-title">Library</h1>
        </div>
        <dialog class="dialog">
            <form action="" method="post" id="myForm">
                <div>
                    <label for="title">Book Title:</label>
                    <input type="text" id="title" name="title">
                </div>
                <div>
                    <label for="author">Author:</label>
                    <input type="text" id="author" name="author">
                </div>
                <div>
                    <label for="pages">Number of Pages:</label>
                    <input type="number" id="pages" name="pages">
                </div>
                <div class="read-status-form">
                    <label for="read">Have you read this book?</label>
                    <select name="read" id="read">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
                <div class="form-button-div">
                    <button type="submit" class="form-button">Submit</button>
                </div>

            </form>
        </dialog>
        <div class="button-container">
            <button class="new-book">New Book</button>
        </div>
    </div>
    <div class="book-background">
        <div class="container" id="main-container">
            <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>
                        <div class="book"></div>
            <div class="book"></div>
            <div class="book"></div>

        </div>
    </div>


    
    
</body>
</html>
